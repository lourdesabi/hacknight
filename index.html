<!DOCTYPE html>
<html>
  <head>
    <title>NEON DODGE - Cyber Rush</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #0a0a0a;
        background-image:
          radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 80% 80%, rgba(255, 100, 0, 0.1) 0%, transparent 50%),
          radial-gradient(circle at 40% 20%, rgba(0, 150, 255, 0.1) 0%, transparent 50%);
        font-family: 'Orbitron', 'Courier New', monospace;
        overflow: hidden;
      }

      #game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        padding: 20px;
      }

      #game-title {
        font-size: 56px;
        font-weight: 900;
        color: #00ffff;
        text-transform: uppercase;
        letter-spacing: 8px;
        text-shadow:
          0 0 10px #00ffff,
          0 0 20px #00ffff,
          0 0 40px #00ffff,
          0 0 80px #00ffff,
          0 0 120px rgba(0, 255, 255, 0.5);
        animation: neonPulse 2s ease-in-out infinite alternate;
        position: relative;
      }

      #game-title::before {
        content: 'NEON DODGE';
        position: absolute;
        top: 0;
        left: 0;
        color: #ff6600;
        text-shadow:
          0 0 10px #ff6600,
          0 0 20px #ff6600,
          0 0 40px #ff6600;
        animation: glitchNeon 3s infinite;
        clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
      }

      @keyframes neonPulse {
        from {
          text-shadow:
            0 0 10px #00ffff,
            0 0 20px #00ffff,
            0 0 40px #00ffff,
            0 0 80px #00ffff;
        }
        to {
          text-shadow:
            0 0 20px #00ffff,
            0 0 30px #00ffff,
            0 0 60px #00ffff,
            0 0 100px #00ffff,
            0 0 140px rgba(0, 255, 255, 0.8);
        }
      }

      @keyframes glitchNeon {
        0%, 90%, 100% {
          opacity: 0;
        }
        91%, 94% {
          opacity: 1;
          transform: translate(-2px, -2px);
        }
        92%, 96% {
          opacity: 1;
          transform: translate(2px, 2px);
        }
      }

      #canvas-wrapper {
        position: relative;
        border-radius: 15px;
        padding: 5px;
        background: linear-gradient(45deg, #00ffff, #0099ff, #ff6600, #00ffff);
        background-size: 300% 300%;
        animation: gradientShift 3s ease infinite;
      }

      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      canvas {
        display: block;
        border-radius: 10px;
        box-shadow:
          0 0 30px rgba(0, 255, 255, 0.5),
          0 0 60px rgba(0, 150, 255, 0.3),
          inset 0 0 20px rgba(0, 0, 0, 0.5);
      }

      #instructions {
        color: #00ffff;
        font-size: 18px;
        font-weight: 700;
        text-align: center;
        text-shadow:
          0 0 5px #00ffff,
          0 0 10px #00ffff,
          0 2px 10px rgba(0, 0, 0, 0.8);
        letter-spacing: 2px;
        line-height: 1.6;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px 30px;
        border-radius: 10px;
        border: 2px solid #00ffff;
        box-shadow:
          0 0 20px rgba(0, 255, 255, 0.3),
          inset 0 0 20px rgba(0, 255, 255, 0.1);
      }

      #instructions span {
        color: #ff6600;
        text-shadow:
          0 0 5px #ff6600,
          0 0 10px #ff6600;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <div id="game-title">NEON DODGE</div>
      <div id="canvas-wrapper">
        <div id="canvas-holder"></div>
      </div>
      <div id="instructions">
        <span>←→</span> MOVE | <span>💰</span> COINS +100 | <span>🪨</span> DODGE ROCKS!
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.0.0/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/molleindustria/p5.play@42cd19c3/lib/p5.play.js"></script>
    <script src="script.js"></script>
  </body>
</html>
